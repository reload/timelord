[project]
name = "timelord"
revision = "1.0"

[providers]
reload = "onepassword://reloadas.1password.com@Shared"

[profiles.default]
TIMELORD_BASIC_AUTH_USER = { description = "Basic auth username for timelord.reload.dk", ref = { item = "Timelord basic auth", field = "username" }, providers = ["reload"] }
TIMELORD_BASIC_AUTH_PASSWORD = { description = "Basic auth password for timelord.reload.dk", ref = { item = "Timelord basic auth", field = "password" }, providers = ["reload"] }
TIMELORD_BASIC_AUTH_ALLOWED_IPS = { description = "Space separated IPs that don't need basic auth (the Reload office)", ref = { item = "Timelord basic auth", field = "TIMELORD_BASIC_AUTH_ALLOWED_IPS" }, providers = ["reload"] }
